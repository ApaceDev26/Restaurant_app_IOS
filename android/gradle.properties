org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true

# Support 16 KB page size (required for Android 15+ / 64-bit devices)
android.bundle.enableUncompressedNativeLibs=true

# Pub cache is on K: while the project is on I:. Kotlin incremental caches
# cannot relativize paths across Windows drive roots, so disable them.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
